<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridal Store – Gestão Inteligente</title>
<meta name="description" content="Sistema de gestão para lojas de vestidos de noiva, festa, ternos e acessórios: aluguel, vendas, caixa, financeiro e agenda.">
<meta name="theme-color" content="#0d0c0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bridal Store">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash"><div class="spin"></div></div>

<!-- LOGIN -->
<section id="login" hidden>
  <button class="icon-btn theme-l" id="themeBtnL" aria-label="Alternar tema"></button>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand-l"><span class="ring-ic" aria-hidden="true"></span><h1>Noiva <i>&amp;</i> Cia.</h1><small>by Adriana Leal</small></div>
    <p class="sys">Bridal Store – Gestão Inteligente</p>
    <label>Usuário<input id="lg_user" class="input" name="username" autocomplete="username" autocapitalize="none" required placeholder="admin"></label>
    <label>Senha<div class="pw"><input id="lg_pass" class="input" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"><button type="button" id="togglePass" class="icon-btn" aria-label="Mostrar senha" tabindex="-1">👁</button></div></label>
    <div id="lg_err" class="lg-err" role="alert"></div>
    <button class="btn gold block lg" type="submit">Entrar</button>
    <div id="lg_status" class="lg-status"></div>
    <button type="button" class="btn ghost sm block" id="btnInstallL" data-act="app:install" style="display:none">Instalar aplicativo</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand"><span class="ring-ic" aria-hidden="true"></span><div><b>Noiva <i>&amp;</i> Cia.</b><small>Bridal Store · Gestão Inteligente</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div class="who"><span class="avatar" id="uAv"></span><div><b id="uName"></b><small id="uRole"></small></div></div><button class="icon-btn" id="logoutBtn" title="Sair" aria-label="Sair"></button></div>
  </aside>
  <div id="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-m" id="menuBtn" aria-label="Menu"></button>
      <h2 id="pageTitle"></h2>
      <div class="grow"></div>
      <button class="sync off" id="syncBtn" aria-label="Sincronização"><i></i><span>Sem planilha</span></button>
      <button class="btn sm gold" id="btnInstall" data-act="app:install" style="display:none">Instalar app</button>
      <button class="icon-btn bell" id="bellBtn" aria-label="Notificações"><em id="bellCount" class="nbadge" hidden></em></button>
      <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"></button>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/domain.js"></script>
<script src="js/pages1.js"></script>
<script src="js/pages2.js"></script>
<script src="js/pages2b.js"></script>
<script src="js/pages3.js"></script>
<script src="js/pages4.js"></script>
<script src="js/app.js"></script>
<script>
// ícones estáticos do layout
document.querySelector('#logoutBtn').innerHTML = ic('logout',18);
document.querySelector('#menuBtn').innerHTML = ic('menu',22);
document.querySelector('#bellBtn').insertAdjacentHTML('afterbegin', ic('bell',20));
</script>
</body>
</html>
